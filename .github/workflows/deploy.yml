# Deploys to GitHub Pages. `--base-href` must match the repository name:
# https://<user>.github.io/<repo>/ needs `/<repo>/`; a user/organisation
# site (<user>.github.io) or a custom domain needs `/`.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --base-href /TURNIEJ-HS/

      - name: SPA fallback for GitHub Pages
        run: cp dist/TURNIEJ-HS/browser/index.html dist/TURNIEJ-HS/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/TURNIEJ-HS/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
