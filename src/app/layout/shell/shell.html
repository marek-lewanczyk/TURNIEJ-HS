<div class="relative min-h-dvh">
  @defer (on viewport) {
    <app-teren />
  } @placeholder {
    <div class="pointer-events-none fixed inset-0 -z-10" aria-hidden="true"></div>
  } @error {
    <!-- A failed chunk fetch (e.g. a hashed chunk 404ing after a redeploy)
         must land on the same gradient fallback Teren itself renders when
         WebGL is unavailable — every failure path ends here. -->
    <div
      class="pointer-events-none fixed inset-0 -z-10 bg-linear-to-b from-papier to-papier-cien"
      aria-hidden="true"
    ></div>
  }

  <header class="mx-auto w-full max-w-5xl px-5 pt-10 pb-6">
    <p class="text-xs uppercase tracking-[0.2em] text-atrament-slaby">
      {{ store.turniej().organizator }}
    </p>
    <h1 class="mt-2 text-4xl leading-tight font-semibold sm:text-5xl">
      {{ store.turniej().nazwa }}
    </h1>

    <nav aria-label="Sekcje turnieju" class="mt-8 flex flex-wrap gap-x-6 gap-y-2">
      <a
        routerLink="/"
        routerLinkActive
        #rlaRanking="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [ariaCurrentWhenActive]="'page'"
        [class]="
          'border-b-2 pb-1 text-sm font-medium hover:border-warstwica ' +
          (rlaRanking.isActive ? 'text-sygnal border-sygnal' : 'border-transparent')
        "
        >Ranking</a
      >
      <a
        routerLink="/inspiracje"
        routerLinkActive
        #rlaInspiracje="routerLinkActive"
        [ariaCurrentWhenActive]="'page'"
        [class]="
          'border-b-2 pb-1 text-sm font-medium hover:border-warstwica ' +
          (rlaInspiracje.isActive ? 'text-sygnal border-sygnal' : 'border-transparent')
        "
        >Inspiracje</a
      >
      <a
        routerLink="/zadania"
        routerLinkActive
        #rlaZadania="routerLinkActive"
        [ariaCurrentWhenActive]="'page'"
        [class]="
          'border-b-2 pb-1 text-sm font-medium hover:border-warstwica ' +
          (rlaZadania.isActive ? 'text-sygnal border-sygnal' : 'border-transparent')
        "
        >Zadania</a
      >
      <a
        routerLink="/zasady"
        routerLinkActive
        #rlaZasady="routerLinkActive"
        [ariaCurrentWhenActive]="'page'"
        [class]="
          'border-b-2 pb-1 text-sm font-medium hover:border-warstwica ' +
          (rlaZasady.isActive ? 'text-sygnal border-sygnal' : 'border-transparent')
        "
        >Zasady</a
      >
      <a
        routerLink="/materialy"
        routerLinkActive
        #rlaMaterialy="routerLinkActive"
        [ariaCurrentWhenActive]="'page'"
        [class]="
          'border-b-2 pb-1 text-sm font-medium hover:border-warstwica ' +
          (rlaMaterialy.isActive ? 'text-sygnal border-sygnal' : 'border-transparent')
        "
        >Materiały</a
      >
      <a
        routerLink="/nagrody"
        routerLinkActive
        #rlaNagrody="routerLinkActive"
        [ariaCurrentWhenActive]="'page'"
        [class]="
          'border-b-2 pb-1 text-sm font-medium hover:border-warstwica ' +
          (rlaNagrody.isActive ? 'text-sygnal border-sygnal' : 'border-transparent')
        "
        >Nagrody
        @if (!store.nagrodyDostepne()) {
          <span class="ml-1 text-xs text-atrament-slaby">wkrótce</span>
        }
      </a>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-5xl px-5 pb-24">
    <router-outlet />
  </main>

  <footer class="mx-auto w-full max-w-5xl px-5 pb-10 text-xs text-atrament-slaby">
    {{ store.turniej().start }} – {{ store.turniej().koniec }}
  </footer>
</div>
